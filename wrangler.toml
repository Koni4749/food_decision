name = "michuhol-food-picker"
main = "src/worker.ts"
compatibility_date = "2025-11-01"

[assets]
directory = "./dist"
binding = "ASSETS"
not_found_handling = "single-page-application"
run_worker_first = ["/api/*"]

# Workers Builds(Wrangler v4.45+)는 id 없이 binding만 선언해도 첫 배포 시 자동으로 KV를 생성·연결합니다.
# 이미 대시보드에서 만든 KV가 있다면 아래 주석을 풀고 id를 넣어주세요.
[[kv_namespaces]]
binding = "FOOD_KV"
# id = "여기에_KV_네임스페이스_ID_입력"

# 관리자 비밀번호(ADMIN_PASSWORD)는 보안상 이 파일에 적지 말고
# Cloudflare 대시보드 > Workers > Settings > Variables and Secrets 에서 Secret으로 추가하세요.
# (미설정 시 코드 기본값 "1234"가 사용됩니다.)
